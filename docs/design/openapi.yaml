openapi: 3.0.3
info:
  title: AdoptAJob Backend API
  version: 0.1.0
  description: |
    Local proof-of-concept REST API for AdoptAJob. The backend owns
    PostgreSQL and delegates candidate ranking to the internal matching
    service. Protected attributes and photos are never ranking inputs.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Candidate
  - name: Recruiter
  - name: Internal
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      responses:
        "200":
          description: Service dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /candidates/me:
    get:
      tags: [Candidate]
      operationId: getCandidateProfile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Candidate profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Candidate]
      operationId: updateCandidateProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfileInput"
      responses:
        "200":
          description: Updated candidate profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /candidates/me/feed:
    get:
      tags: [Candidate]
      operationId: getCandidateFeed
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Ordered job cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates/me/swipes:
    post:
      tags: [Candidate]
      operationId: createSwipe
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
      responses:
        "201":
          description: Swipe recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Conflicting idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recruiters/me/cards:
    get:
      tags: [Recruiter]
      operationId: listRecruiterCards
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Recruiter-owned cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Recruiter]
      operationId: createRecruiterCard
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCardInput"
      responses:
        "201":
          description: Card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /internal/matching/rank:
    post:
      tags: [Internal]
      operationId: rankCards
      security: [{ internalServiceAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RankingRequest"
      responses:
        "200":
          description: Ordered card IDs and scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: service-token
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: backend
    ReadinessResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [up]
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          writeOnly: true
        role:
          type: string
          enum: [CANDIDATE, RECRUITER]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"
    UserSummary:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CANDIDATE, RECRUITER]
    CandidateProfileInput:
      type: object
      properties:
        background:
          type: string
          maxLength: 4000
        educationLevel:
          type: string
          enum: [NONE, SECONDARY, VOCATIONAL, BACHELOR, MASTER, DOCTORATE]
        yearsExperience:
          type: integer
          minimum: 0
    CandidateProfile:
      allOf:
        - $ref: "#/components/schemas/CandidateProfileInput"
        - type: object
          required: [userId]
          properties:
            userId:
              type: string
              format: uuid
    JobCardInput:
      type: object
      required: [title, description, contractType]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        contractType:
          type: string
          enum: [FULL_TIME, PART_TIME, INTERNSHIP, TEMPORARY, FREELANCE]
    JobCard:
      allOf:
        - $ref: "#/components/schemas/JobCardInput"
        - type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, PUBLISHED, UNPUBLISHED]
    FeedResponse:
      type: object
      required: [items, nextCursor, source]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobCard"
        nextCursor:
          type: string
          nullable: true
        source:
          type: string
          enum: [matching, most-recent]
    SwipeRequest:
      type: object
      required: [cardId, action]
      properties:
        cardId:
          type: string
          format: uuid
        action:
          type: string
          enum: [LIKE, PASS]
    SwipeResponse:
      type: object
      required: [cardId, action, recorded]
      properties:
        cardId:
          type: string
          format: uuid
        action:
          type: string
          enum: [LIKE, PASS]
        recorded:
          type: boolean
    RankingRequest:
      type: object
      required: [candidateId]
      properties:
        candidateId:
          type: string
          format: uuid
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    RankingResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [cardId, score]
            properties:
              cardId:
                type: string
                format: uuid
              score:
                type: number
                format: float
